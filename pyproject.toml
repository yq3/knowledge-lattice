[project]
name = "knowledge-lattice"
version = "0.1.0"
description = "企业知识层服务（文档知识 + 业务语义）——lab POC，设计见 docs/design.md"
readme = "README.md"
# G-11：requires-python 钉 >=3.11（docling/FastMCP 硬性下限），部署钉 uv 托管 CPython 3.12（开发=部署同版本）
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.3.3",
    "docling>=2.142.1",
    "fastapi[standard]>=0.161.1",
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "numpy>=1.26",
    "psycopg[binary,pool]>=3.2",
    "pyahocorasick>=2.0",
    "pyjwt>=2.15.1",
    "pypinyin",
    "python-ulid>=4.0.1",
    "sqlite-vec>=0.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]
# m3-4 D 组：评测扩展依赖（ragas——合成候选生成〔一次性离线动作〕与 m3-5
# 响应层指标 judge 面）。不进默认同步（D2 最小服务端依赖纪律——服务端运行
# 镜像不背 langchain/datasets 全家桶）；使用：uv run --group eval …。
# 门禁所需 deepeval 在主依赖（默认安装可跑）。
eval = [
    # ragas 0.2~0.4 各线在 ragas/llms/base.py 顶层 import
    # langchain_community.chat_models.vertexai——该模块自 langchain-community
    # 0.3.27 起移除（迁移至 langchain-google-vertexai），ragas 对 langchain 系
    # 全部未钉版本、按最新解析必 ModuleNotFoundError。钉 era-consistent 组合
    # （ragas 0.2.15 × langchain 0.3 系）；上游修复（或本仓转 langchain 1.x
    # 生态重评）后可放宽。
    "ragas==0.2.15",
    "langchain-core>=0.3.21,<0.4",
    "langchain-community>=0.3.14,<0.3.27",
    "langchain>=0.3.17,<0.4",
    "langchain-openai>=0.2.9,<0.3",
    # NonLLMStringSimilarity（离线确定性自检）需要——ragas 核心未含（all extra）
    "rapidfuzz>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_lattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# m3-4：禁用 deepeval 随包注入的 pytest 插件（sessionfinish 打印噪声/工件落盘/
# sessionstart telemetry——门禁离线确定性口径；assert_test 断言面不受影响，
# 用例内直接 import deepeval 使用）。插件口径：DEEPEVAL=1 时才主动启用。
addopts = "-p no:deepeval"
markers = [
  "pdf_models: 需要 docling layout 模型权重的用例（首次运行联网下载，之后走本地缓存）",
  "manual: 手动走查用例（浏览器人工执行，不进 CI——TC-UI 组口径）",
]
# m3-4 E-2 warnings 治理：**只登记第三方库 Deprecation 噪音**（窄匹配——消息
# 前缀 + 来源模块），本项目代码产生的 warning 一律修源头清零、不在此过滤
# （弱密钥 InsecureKeyLengthWarning 已升位清零）。docling 两条：
# PdfPipelineOptions 字段弃用提示——我们的 parser 仅设置合法字段、触发面在
# docling 内部构造链，docling 升级后按需移除；deepeval 一条：assert_test 同步
# 路径取事件循环的弃用提示（门禁用例为确定性同步指标，无事件循环是预期形态）。
filterwarnings = [
  "ignore:`force_full_page_ocr` is deprecated:DeprecationWarning",
  "ignore:This field is deprecated:DeprecationWarning:docling\\.pipeline",
  "ignore:There is no current event loop:DeprecationWarning:deepeval\\.utils",
]
